<li class="list-group-item">
  <div class="d-flex justify-content-between">
    <!-- left -->
    <label for="role-{{role().role}}" class="pointer mb-0">
      <span>{{description}}</span>
    </label>
    <!-- right -->
    @if(!processing()) {
      <div class="form-check form-switch">
        <input type="checkbox" class="form-check-input" id="role-{{role().role}}"
          [checked]="role().authorization.hasRoles(role().role)" [disabled]="disabled()"
          (change)="toggle()">
        <label class="form-check-label" for="role-{{role().role}}"></label>
      </div>
    }
    @if (processing()) {
      <fa-icon class="my-2 me-2" [icon]="faSpinner" animations="spin"></fa-icon>
    }
  </div>
</li>
