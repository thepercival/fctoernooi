@if (settings()) {
  <div class="container">
    @if (processing) {
      <h2 class="text-center">
        <fa-icon [icon]="['fas', 'spinner']" animations="spin"></fa-icon>
      </h2>
    }
    
    @if (alert) {
      <ngb-alert [type]="alert.type">{{ alert.message }}</ngb-alert>
    }
    
    @if (typedForm && !processing) {
      <form formGroup="typedForm" name="form" (ngSubmit)="save()" novalidate>    
        <div class="row my-3">
          <div class="col-5">
            <label for="remark" class="col-form-label">extra tekst op formulier</label>
          </div>
          <div class="col-7">
            <textarea class="form-control"
              [class.is-invalid]="typedForm.controls.remark.invalid"
              [class.is-valid]="typedForm.controls.remark.valid"
              rows="5"
              formControlName="remark" placeholder="max. {{validations.maxlengthremark}} karakters"></textarea>
          </div>
        </div>
     
        <div class="row mb-3">
          <div class="col-5 d-flex justify-content-end">
            <button type="button" class="btn btn-outline-primary"
              routerLink="['/public/registrationform', tournament().getId()]">
              <fa-icon [icon]="['fas', 'eye']"></fa-icon> <span class="ms-1">bekijk formulier</span>
            </button>
          </div>    
          <div class="col-7">
            <button [disabled]="typedForm.invalid" type="submit" class="btn btn-primary">
              opslaan
            </button>
          </div>      
        </div>
      </form>
    }

    <div class="row mb-3">
      <ngb-alert type="info"><b>printen:</b> kies voor "opties" en dan "printen"</ngb-alert>
    </div>

  </div>
}
